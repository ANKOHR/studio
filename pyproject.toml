[build-system]
requires = ["setuptools==75.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "studio-brand-engine"
version = "0.1.0"
description = "A deterministic, token-driven launch package generator for fictional brands."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[project.scripts]
studio = "studio.cli:main"

[tool.setuptools]
packages = ["studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

